<!doctype html>
<html lang="mn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Багшдаа зориулсан бяцхан сюрприз</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,"Segoe UI",sans-serif}
body{background:#090b18;color:white}
.stage{position:relative;width:100%;height:100%;min-height:100vh;display:flex;align-items:center;justify-content:center;overflow:hidden;background:
radial-gradient(circle at 50% 45%,#263052 0%,#12162b 42%,#070914 100%)}
.stage:before{content:"";position:absolute;inset:0;background:
radial-gradient(circle at 20% 20%,rgba(255,220,140,.10),transparent 25%),
radial-gradient(circle at 80% 75%,rgba(170,130,255,.12),transparent 28%)}
.card{position:relative;z-index:5;width:min(90%,560px);padding:42px 25px;text-align:center;border:1px solid rgba(255,255,255,.14);
background:rgba(255,255,255,.07);backdrop-filter:blur(12px);border-radius:28px;box-shadow:0 20px 80px rgba(0,0,0,.35)}
.small{font-size:14px;letter-spacing:3px;opacity:.75;margin-bottom:16px}
h1{font-size:clamp(26px,7vw,48px);line-height:1.12;margin:0 0 25px;font-weight:800}
p{font-size:18px;opacity:.85}
.btn{border:0;border-radius:999px;padding:16px 34px;font-size:19px;font-weight:800;cursor:pointer;color:#111;background:#fff;
box-shadow:0 8px 30px rgba(255,255,255,.2);transition:.2s}
.btn:active{transform:scale(.95)}
.hidden{display:none!important}
#fireworks{position:absolute;inset:0;width:100%;height:100%;z-index:2}
.message{position:absolute;z-index:8;width:min(92%,900px);text-align:center;opacity:0;transform:scale(.65);transition:1.5s ease}
.message.show{opacity:1;transform:scale(1)}
.message h2{font-size:clamp(30px,7vw,70px);line-height:1.08;margin:0;text-shadow:0 5px 35px rgba(255,255,255,.2)}
.rose{font-size:clamp(35px,8vw,70px);margin-bottom:10px}
.phrase{position:absolute;z-index:9;font-size:clamp(18px,4vw,31px);font-weight:800;opacity:0;white-space:nowrap;
animation:floatUp 4.8s ease forwards;text-shadow:0 3px 18px rgba(0,0,0,.55)}
@keyframes floatUp{
0%{opacity:0;transform:translateY(30px) scale(.85)}
15%{opacity:1}
80%{opacity:1}
100%{opacity:0;transform:translateY(-150px) scale(1.04)}
}
.final{position:absolute;z-index:10;width:min(90%,600px);text-align:center;opacity:0;transform:translateY(20px);transition:1s}
.final.show{opacity:1;transform:translateY(0)}
.final h3{font-size:clamp(28px,7vw,55px);margin:0 0 12px}
.final p{margin:0;font-size:18px}
</style>
</head>
<body>
<div class="stage" id="stage">
<canvas id="fireworks"></canvas>

<div class="card" id="card">
  <div id="step1">
    <div class="small">ТАНД ЗОРИУЛСАН</div>
    <h1>Бяцхан сюрприз✨</h1>
    <button class="btn" onclick="nextStep(1)">ЭНД ДАР</button>
  </div>
  <div id="step2" class="hidden">
    <div class="small">НЭГ Л АЛХАМ ҮЛДЛЭЭ</div>
    <h1>Жаахан тэвчээртэй байгаарай...🌷</h1>
    <button class="btn" onclick="nextStep(2)">ДАХИАД ЭНД ДАР</button>
  </div>
  <div id="step3" class="hidden">
    <div class="small">😄</div>
    <h1>СҮҮЛИЙН УДАА!💫</h1>
    <button class="btn" onclick="celebrate()">ЭНД ДАР!</button>
  </div>
</div>

<div class="message" id="message">
  <div class="rose">🌷✨🌷</div>
  <h2>ДЭЛХИЙН БАГШ НАРЫН ӨДРИЙН БАЯРЫН МЭНДИЙГ ХҮРГЭЕ!</h2>
</div>
<div class="final" id="final">
  <h3>Баярлалаа, багш аа! 🤍</h3>
  <p>Шавь нарын тань зүгээс хүндэтгэн мэндчилж байна!</p>
</div>
</div>

<script>
const stage=document.getElementById("stage");
const card=document.getElementById("card");
const message=document.getElementById("message");
const final=document.getElementById("final");
const canvas=document.getElementById("fireworks");
const ctx=canvas.getContext("2d");
let particles=[], rockets=[], running=false;

function resize(){
  canvas.width=innerWidth*devicePixelRatio;
  canvas.height=innerHeight*devicePixelRatio;
  canvas.style.width=innerWidth+"px";
  canvas.style.height=innerHeight+"px";
  ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
}
addEventListener("resize",resize); resize();

function nextStep(n){
  document.getElementById("step"+n).classList.add("hidden");
  document.getElementById("step"+(n+1)).classList.remove("hidden");
}

function burst(x,y){
  const count=90+Math.floor(Math.random()*45);
  for(let i=0;i<count;i++){
    const a=Math.random()*Math.PI*2, s=2+Math.random()*6;
    particles.push({
      x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,
      life:70+Math.random()*45,max:115,size:1.5+Math.random()*2.5,
      hue:Math.random()*360
    });
  }
}

function launch(){
  const x=innerWidth*(.18+Math.random()*.64);
  rockets.push({x,y:innerHeight+10,targetY:innerHeight*(.18+Math.random()*.42),
    vy:-8-Math.random()*4});
}

function loop(){
  if(!running)return;
  ctx.fillStyle="rgba(7,9,20,.22)";
  ctx.fillRect(0,0,innerWidth,innerHeight);
  if(Math.random()<.045) launch();

  rockets.forEach((r,i)=>{
    r.y+=r.vy; r.vy+=.07;
    ctx.beginPath();ctx.arc(r.x,r.y,2.2,0,Math.PI*2);ctx.fillStyle="#fff";ctx.fill();
    if(r.y<=r.targetY){burst(r.x,r.y);rockets.splice(i,1)}
  });

  particles.forEach((p,i)=>{
    p.x+=p.vx;p.y+=p.vy;p.vy+=.045;p.vx*=.992;p.life--;
    ctx.globalAlpha=Math.max(0,p.life/p.max);
    ctx.fillStyle=`hsl(${p.hue},100%,70%)`;
    ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,Math.PI*2);ctx.fill();
    if(p.life<=0)particles.splice(i,1);
  });
  ctx.globalAlpha=1;
  requestAnimationFrame(loop);
}

const phrases=[
"Баярлалаа, багш аа🤍","Та бол бидний гэрэл✨","Сайхан багшдаа🌷",
"Таны шавь байх сайхан","Таны үг — урам","Таны хичээл — дурсамж",
"Бид танд итгэдэг","Таны хөдөлмөр үнэтэй, та бол бидний үлгэр дуурайлал",
"Үргэлж инээмсэглэж яваарай💐","Бид танд хайртай","Танд баярлалаа!"
];

function showPhrases(){
  let i=0;
  const timer=setInterval(()=>{
    const el=document.createElement("div");
    el.className="phrase";
    el.textContent=phrases[Math.floor(Math.random()*phrases.length)];
    el.style.left=(8+Math.random()*76)+"%";
    el.style.top=(45+Math.random()*40)+"%";
    el.style.animationDelay=(Math.random()*.3)+"s";
    stage.appendChild(el);
    setTimeout(()=>el.remove(),5200);
    i++;
    if(i>18) clearInterval(timer);
  },650);
}

function celebrate(){
  card.classList.add("hidden");
  running=true;
  for(let i=0;i<7;i++) setTimeout(()=>burst(innerWidth*(.15+Math.random()*.7),innerHeight*(.15+Math.random()*.45)),i*280);
  loop();
  setTimeout(()=>message.classList.add("show"),700);
  setTimeout(showPhrases,1600);
  setTimeout(()=>{
    message.classList.remove("show");
    final.classList.add("show");
  },13000);
}
</script>
</body>
</html>
